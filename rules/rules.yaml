rules:
  # --- Inflows ---

  - match: NATIONAL SERV M/W
    type: BGC
    direction: in
    category: Salary

  - match: OMASIRICHI OKWU BO
    type: FPI
    direction: in
    category: Unexpected / Refund

  - match: SOMTOCHUKWU NCHEKW
    type: FPI
    direction: in
    category: Unexpected / Refund

  # --- Regular Outflows ---

  - match: LLOYDS BANK PLC
    type: DD
    direction: out
    category: Debt

  - match: HLAM REGULAR SAVIN
    type: DD
    direction: out
    category: Active Savings

  # --- Food Supplies ---

  - match: OMASIRICHI OKWU BO
    type: FPO
    direction: out
    category: Food Supplies

  - match: OMASIRICHI OKWU-BO
    type: FPO
    direction: out
    category: Food Supplies

  # --- Assets ---

  - match: Trading 212
    type: DEB
    direction: out
    category: Stocks & Shares ISA

  # --- Charity / Donations ---

  - match: GRACE AKANNI
    type: FPO
    direction: out
    category: Charity / Donations

  - match: SOMTOCHUKWU NCHEKW
    type: FPO
    direction: out
    category: Charity / Donations

  - match: MAUTON TOLULOPE HU
    type: FPO
    direction: out
    category: Charity / Donations
