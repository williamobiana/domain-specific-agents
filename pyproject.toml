[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-summary-cli"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "pdf2docx",
    "python-docx",
]

[project.scripts]
expense-summary = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
